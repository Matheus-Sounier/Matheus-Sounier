<svg width="1200" height="60" viewBox="0 0 1200 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated wave divider">
  <defs>
    <linearGradient id="line-gradient" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#0f172a"/>
      <stop offset="0.3" stop-color="#00ff87"/>
      <stop offset="1"   stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path
    d="M0 30 C180 5 260 55 420 30 C590 4 700 56 860 30 C1010 8 1110 50 1200 30"
    stroke="url(#line-gradient)"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  >
    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
        M0 30 C180 5 260 55 420 30 C590 4 700 56 860 30 C1010 8 1110 50 1200 30;
        M0 30 C170 55 270 4 420 30 C580 56 710 5 860 30 C1015 52 1100 8 1200 30;
        M0 30 C180 5 260 55 420 30 C590 4 700 56 860 30 C1010 8 1110 50 1200 30"
    />
  </path>
</svg>