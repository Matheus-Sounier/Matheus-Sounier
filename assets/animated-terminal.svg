<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated terminal workflow">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ff8825"/>
      <stop offset="0.25" stop-color="#00ff87"/>
      <stop offset="0.60" stop-color="#00ff87"/>
      <stop offset="1" stop-color="#00ff8825"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0;-260 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 25px; font-weight: 700; fill: #e5e7eb; }
      .line { font-size: 23px; fill: #cbd5e1; }
      .muted { fill: #94a3b8; }
      .cyan { fill: #38bdf8; }
      .green { fill: #22c55e; }
      .pink { fill: #ec4899; }
      .cmd { opacity: 0; animation: show 12s ease-in-out infinite; }
      .cmd2 { animation-delay: 1.8s; }
      .cmd3 { animation-delay: 3.6s; }
      .cmd4 { animation-delay: 5.4s; }
      .cmd5 { animation-delay: 7.2s; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes show {
        0%, 8% { opacity: 0; transform: translateY(8px); }
        14%, 78% { opacity: 1; transform: translateY(0); }
        90%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#panel)"/>
  <rect x="2" y="2" width="1196" height="416" rx="26" stroke="url(#accent)" stroke-width="4" opacity="0.9"/>
  <rect x="42" y="36" width="1116" height="348" rx="20" fill="#020617" opacity="0.92" stroke="#1e293b"/>
  <rect x="42" y="36" width="1116" height="58" rx="20" fill="#0f172a"/>
  <rect x="42" y="74" width="1116" height="20" fill="#0f172a"/>

  <circle cx="78" cy="65" r="8" fill="#ef4444"/>
  <circle cx="105" cy="65" r="8" fill="#f59e0b"/>
  <circle cx="132" cy="65" r="8" fill="#22c55e"/>

  <text x="178" y="74" class="mono title">Matheus Sounier / developer</text>
  <text x="900" y="74" class="mono line muted">system online</text>
  <circle cx="1098" cy="65" r="9" fill="#22c55e" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <g class="mono">

    <!-- Linha 1 -->
    <g class="cmd cmd1">
      <text x="82" y="135" class="line">
        <tspan class="green">$</tspan>
        load-profile --developer "Matheus Sounier"
      </text>
    </g>

    <!-- Linha 2 -->
    <g class="cmd cmd2">
      <text x="82" y="183" class="line">
        <tspan class="cyan">✓</tspan>
        Backend Development · Computer Vision · Real-Time Systems
      </text>
    </g>

    <!-- Linha 3 -->
    <g class="cmd cmd3">
      <text x="82" y="231" class="line">
        <tspan class="cyan">✓</tspan>
        Python · C++ · OpenCV · SQL · Docker · Oracle DB
      </text>
    </g>

    <!-- Linha 4 -->
    <g class="cmd cmd4">
      <text x="82" y="279" class="line">
        <tspan class="pink">→</tspan>
        Facial Tracking · Motion Detection · REST APIs
      </text>
    </g>

    <!-- Linha 5 -->
    <g class="cmd cmd5">
      <text x="82" y="327" class="line">
        <tspan class="green">ready</tspan>
        building real-time and computer vision systems
      </text>
    </g>

  </g>

  <rect x="82" y="350" width="18" height="28" rx="3" fill="#00ff87" class="cursor"/>

  <g class="float" opacity="0.95">

    <!-- Glow externo -->
    <ellipse cx="945"
             cy="180"
             rx="72"
             ry="47"
             fill="#00ff87"
             opacity="0.08"/>

    <!-- Contorno principal do olho -->
    <ellipse cx="945"
             cy="180"
             rx="65"
             ry="40"
             fill="#020617"
             stroke="#00ff87"
             stroke-width="3"/>

    <!-- Contorno interno -->
    <ellipse cx="945"
             cy="180"
             rx="58"
             ry="34"
             fill="none"
             stroke="#38bdf8"
             stroke-width="1"
             opacity="0.4"/>

    <!-- Linhas de scanner -->
    <line x1="880"
          y1="180"
          x2="1010"
          y2="180"
          stroke="#00ff87"
          opacity="0.15"/>

    <line x1="945"
          y1="140"
          x2="945"
          y2="220"
          stroke="#00ff87"
          opacity="0.15"/>

    <!-- Íris externa -->
    <circle cx="945"
            cy="180"
            r="28"
            fill="#0f172a"
            stroke="#38bdf8"
            stroke-width="2"/>

    <!-- Anel tecnológico -->
    <circle cx="945"
            cy="180"
            r="22"
            fill="none"
            stroke="#00ff87"
            stroke-width="1.5"
            stroke-dasharray="5 3"/>

    <!-- Íris -->
    <circle cx="945"
            cy="180"
            r="17"
            fill="#38bdf8"
            opacity="0.8"/>

    <!-- Pupila -->
    <circle cx="945"
            cy="180"
            r="8"
            fill="#020617"/>

    <!-- Reflexo principal -->
    <circle cx="938"
            cy="172"
            r="4"
            fill="#ffffff"
            opacity="0.9"/>

    <!-- Reflexo secundário -->
    <circle cx="952"
            cy="188"
            r="2"
            fill="#ffffff"
            opacity="0.5"/>

    <!-- Pontos de tracking -->
    <circle cx="910"
            cy="180"
            r="2"
            fill="#ec4899"/>

    <circle cx="980"
            cy="180"
            r="2"
            fill="#ec4899"/>

    <circle cx="945"
            cy="150"
            r="2"
            fill="#ec4899"/>

    <circle cx="945"
            cy="210"
            r="2"
            fill="#ec4899"/>

    <!-- Retículo -->
    <path d="M925 180 L935 180" stroke="#00ff87" stroke-width="2"/>
    <path d="M955 180 L965 180" stroke="#00ff87" stroke-width="2"/>
    <path d="M945 160 L945 170" stroke="#00ff87" stroke-width="2"/>
    <path d="M945 190 L945 200" stroke="#00ff87" stroke-width="2"/>

  </g>

</svg>
