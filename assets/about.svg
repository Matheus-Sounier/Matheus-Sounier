<svg viewBox="0 0 1500 950"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;display:block;"
     xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="background"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="950">
            <stop offset="0%" stop-color="#0b1120"/>
            <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <linearGradient id="terminal"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="905">
            <stop offset="0%" stop-color="#111827"/>
            <stop offset="100%" stop-color="#020617"/>
        </linearGradient>
        <filter id="shadow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">
            <feDropShadow
                dx="0"
                dy="12"
                stdDeviation="14"
                flood-color="#000000"
                flood-opacity=".45"/>
        </filter>
        <clipPath id="terminalClip">
            <rect
                x="65"
                y="105"
                width="1370"
                height="770"
                rx="8"/>
        </clipPath>
        <clipPath id="typingClip">
            <rect x="282" y="108" width="0" height="30">
                <animate
                    id="typeAnim"
                    attributeName="width"
                    from="0"
                    to="291"
                    dur="0.8s"
                    begin="0s; clearReset.end+2s"
                    fill="freeze"
                    calcMode="linear"/>
                <set
                    id="clearReset"
                    attributeName="width"
                    to="0"
                    begin="typeAnim.begin+20.0s"
                    dur="0.05s"
                    fill="freeze"/>
            </rect>
        </clipPath>
        <clipPath id="typingClip2">
            <rect x="282" y="815" width="0" height="30">
                <animate
                    attributeName="width"
                    from="0"
                    to="66"
                    dur="0.5s"
                    begin="typeAnim.begin+19.0s"
                    fill="freeze"
                    calcMode="linear"/>
                <set
                    attributeName="width"
                    to="0"
                    begin="typeAnim.begin+20.0s"
                    fill="freeze"/>
            </rect>
        </clipPath>
        <style><![CDATA[
            .mono{
                font-family:
                    "JetBrains Mono",
                    "Cascadia Code",
                    Consolas,
                    monospace;
            }
            .title{
                fill:#e5e7eb;
                font-size:20px;
                font-weight:600;
            }
            .prompt-user{
                fill:#00ff87;
                font-weight:700;
            }
            .terminal-text{
                fill:#f8fafc;
                font-size:22px;
            }
        ]]></style>
    </defs>
    <rect
        width="1500"
        height="950"
        fill="url(#background)"/>
    <rect
        x="45"
        y="35"
        width="1410"
        height="870"
        rx="18"
        fill="url(#terminal)"
        stroke="#1f2937"
        stroke-width="2"
        filter="url(#shadow)"/>
    <rect
        x="45"
        y="35"
        width="1410"
        height="56"
        rx="18"
        fill="#111827"/>
    <rect
        x="45"
        y="72"
        width="1410"
        height="19"
        fill="#111827"/>
    <circle cx="80" cy="63" r="7" fill="#ef4444"/>
    <circle cx="106" cy="63" r="7" fill="#f59e0b"/>
    <circle cx="132" cy="63" r="7" fill="#22c55e"/>
    <text x="175" y="69" class="mono title">Terminal</text>
    <circle cx="1360" cy="63" r="6" fill="#22c55e"/>
    <text x="1375" y="69" class="mono title" font-size="15" fill="#94a3b8">ONLINE</text>
    <text x="70" y="130" class="mono terminal-text">
        <tspan class="prompt-user">sounier@user:</tspan><tspan fill="#94a3b8">~$&#160;</tspan>
    </text>
    <g clip-path="url(#typingClip)">
        <text x="282" y="130" class="mono terminal-text" fill="#94a3b8">cat ./profile/about.py</text>
    </g>
    <rect x="282" y="110" width="3" height="26" fill="#00ff87" opacity="0">
        <set attributeName="opacity" to="1" begin="typeAnim.begin" fill="freeze"/>

        <set attributeName="x" to="282" begin="typeAnim.begin" fill="freeze"/>
        <animate
            attributeName="x"
            from="282"
            to="573"
            dur="0.8s"
            begin="typeAnim.begin"
            fill="freeze"
            calcMode="linear"/>
        <animate
            attributeName="opacity"
            values="1;0;1"
            dur="0.8s"
            begin="typeAnim.begin+1.0s"
            repeatCount="3"/>
        <set attributeName="opacity" to="0" begin="typeAnim.begin+3.7s" fill="freeze"/>
    </rect>
    <g clip-path="url(#terminalClip)">
        <text x="70" y="175" class="mono terminal-text">
            <tspan opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.00s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                developer = {
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.08s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#f472b6">"name"</tspan>:
                <tspan fill="#38bdf8">"Matheus dos Santos Sounier"</tspan>,
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.16s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#f472b6">"age"</tspan>:
                <tspan fill="#fbbf24">18</tspan>,
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.24s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#f472b6">"role"</tspan>:
                <tspan fill="#38bdf8">"Backend &amp; Computer Vision Developer"</tspan>,
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.32s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#f472b6">"status"</tspan>:
                <tspan fill="#38bdf8">"&#9679; building real-time and computer vision systems"</tspan>
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.40s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#f472b6">"focus"</tspan>: [
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.48s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Backend Development"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.56s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Computer Vision"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.64s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Real-Time Systems"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.72s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Embedded Systems"</tspan>,
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.80s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                ],
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.88s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#f472b6">"background"</tspan>: [
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+2.96s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Computer Vision &amp; Facial Tracking"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+3.04s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Motion Detection &amp; Real-Time Processing"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+3.12s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"REST API Architecture"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+3.20s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Dockerized Environments"</tspan>,
            </tspan>
            <tspan x="135" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+3.28s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                <tspan fill="#38bdf8">"Oracle Database Integration"</tspan>
            </tspan>
            <tspan x="100" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+3.36s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                ]
            </tspan>
            <tspan x="70" dy="34" opacity="0">
                <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="typeAnim.begin+3.44s" fill="freeze"/>
                <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
                }
            </tspan>
        </text>
        <g opacity="0">
            <set attributeName="opacity" to="1" begin="typeAnim.begin+4.0s" fill="freeze"/>
            <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
            <text x="70" y="837" class="mono terminal-text">
                <tspan class="prompt-user">sounier@user:</tspan><tspan fill="#94a3b8">~$&#160;</tspan>
            </text>
            <g clip-path="url(#typingClip2)">
                <text x="282" y="837" class="mono terminal-text" fill="#94a3b8">clear</text>
            </g>
        </g>
        <rect x="282" y="817" width="3" height="26" fill="#00ff87" opacity="0">
            <set attributeName="opacity" to="1" begin="typeAnim.begin+4.0s" fill="freeze"/>

            <set attributeName="x" to="282" begin="typeAnim.begin+4.0s" fill="freeze"/>
            <animate
                attributeName="opacity"
                values="1;0;1"
                dur="0.8s"
                begin="typeAnim.begin+4.0s"
                repeatCount="indefinite"/>
            <set attributeName="opacity" to="1" begin="typeAnim.begin+19.0s" fill="freeze"/>
            <animate
                attributeName="x"
                from="282"
                to="348"
                dur="0.5s"
                begin="typeAnim.begin+19.0s"
                fill="freeze"
                calcMode="linear"/>
            <animate
                attributeName="opacity"
                values="1;0;1"
                dur="0.5s"
                begin="typeAnim.begin+19.5s"
                repeatCount="1"/>
            <set attributeName="opacity" to="0" begin="typeAnim.begin+20.0s" fill="freeze"/>
        </rect>
    </g>
</svg>